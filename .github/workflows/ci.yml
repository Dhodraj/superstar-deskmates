name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Checks
        run: swift run Checks
      - name: Build the app bundle
        run: ./scripts/make_app.sh
